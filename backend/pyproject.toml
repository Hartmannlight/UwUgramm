[project]
name = "uwugramm-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]==0.54.0", "sqlalchemy[asyncio]==2.1.1",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "pydantic-settings==2.15.0",
  "authlib==1.8.0", "httpx==0.28.1", "itsdangerous==2.2.0", "joserfc==1.7.5"
]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "aiosqlite==0.22.1", "ruff==0.16.9", "mypy==1.20.2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
platform = "linux"
